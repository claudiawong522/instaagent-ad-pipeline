[project]
name = "instaagent-ad-pipeline"
version = "0.1.0"
description = "Lean ingestion, enrichment, embedding, and clustering foundation for InstaAgent ad selection."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
instaagent-pipeline = "instaagent_pipeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
