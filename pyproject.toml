[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instaagent-ad-pipeline"
version = "0.1.0"
description = "Lean ingestion, enrichment, embedding, and clustering foundation for InstaAgent ad selection."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Transcode provider cover images (TikTok serves HEIC) to browser-renderable JPEG posters.
    "pillow>=10.3",
    "pillow-heif>=0.16",
    # Strip web trend pages to text before LLM format extraction (trend_sources.py).
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # fastapi.testclient (tests/test_api_routes.py)
    "httpx>=0.27",
]

[project.scripts]
instaagent-pipeline = "instaagent_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.instaagent_pipeline.api.app:app"
