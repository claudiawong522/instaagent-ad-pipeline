name: Test drift email

# Manual sanity check for the parser-drift reminder path (drift_alert.py). Sends ONE sample
# drift email to ALERT_EMAIL_TO using the repo's ALERT_* secrets — the same creds the scheduled
# scrapes use — so you can confirm SMTP actually works without waiting for a real parser to break.
# Trigger from the Actions tab (Run workflow). Does not touch Supabase or scrape anything.
on:
  workflow_dispatch:

jobs:
  send:
    name: send test drift email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send sample drift email
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        # Exit non-zero (red run) if the send didn't actually go out, so a missing/wrong secret
        # is loud instead of a silently-green "emailed: False".
        run: |
          python -m instaagent_pipeline.drift_alert --send | tee /tmp/out.txt
          grep -q "'emailed': True" /tmp/out.txt
