name: Deploy to Vercel (Production)

# Push-to-deploy: every push to main ships production. The author-rewrite step below
# re-stamps the deploy commit as InstaAgent <hello@instaagent.com> so Vercel's author
# check is satisfied regardless of who pushed.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_ORG_ID      team_xFFq8B16R4nNeJlwjUIFmxLn
#   VERCEL_PROJECT_ID  prj_V6uK6iiaageslZP6cNauNIvKzT63
#   VERCEL_TOKEN       create at vercel.com/account/tokens

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Rewrite commit author for Vercel author check
        run: |
          git config user.email "hello@instaagent.com"
          git config user.name "InstaAgent"
          git commit --amend --no-edit --author="InstaAgent <hello@instaagent.com>"

      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
