# Throwaway demo: fails once on push so GitHub sends its workflow-failure email —
# this is exactly the notification a real parser-drift detection will produce
# (via ingest-trends --fail-on-drift). Delete this file after the email arrives.
name: Trend parser drift (example alert)

on: push

jobs:
  example-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate a drifted trend source
        run: |
          echo "error: trend parser drift detected (see drift_alert above)"
          echo ""
          echo "  * socialbee"
          echo "    Structural parser no longer recognizes the page (fell back to the LLM parse)"
          echo "    — a redesign likely moved the trend headings/numbering."
          echo ""
          echo "  Fix: compare the page against src/instaagent_pipeline/trend_sources.py,"
          echo "  reproduce with LIVE_TREND_TESTS=1 pytest tests/test_live_trend_pages.py,"
          echo "  then re-run: python -m instaagent_pipeline.cli ingest-trends --source-name socialbee --force"
          exit 1
