name: Trend scrape

# Daily viral-format ingest (ingest-trends). Unchanged pages are skipped via content-hash,
# so a no-change day only pays the Newengen headless render. Scheduled workflows run on the
# default branch only.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC ≈ 9am ET, after Ramdam's Monday-morning drops
  workflow_dispatch:
    inputs:
      force:
        description: "Re-parse pages even if unchanged since last run"
        type: boolean
        default: false

concurrency:
  group: trend-scrape
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest-trends
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `requests` is imported directly but not yet a declared dependency (same as ci.yml).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install requests

      - name: Run ingest-trends
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m instaagent_pipeline.cli ingest-trends ${{ inputs.force && '--force' || '' }}
