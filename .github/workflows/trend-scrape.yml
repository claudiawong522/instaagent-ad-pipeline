name: Trend scrape (static sources)

# Daily viral-format ingest for the non-newengen sources: ramdam + socialbee (evergreen URLs
# that update weekly) and socialgrowthengineers (a weekly gated newsletter). A daily run catches
# new trends within a day; unchanged pages are skipped via content-hash, so a no-change day is
# nearly free (a plain HTTP/API fetch, no headless render).
#
# newengen is deliberately NOT here — it's a monthly, JS-rendered report whose flaky render
# changes the page text (and content-hash) on every fetch, defeating the skip gate; scraping it
# daily re-parses the same frozen report ~30x/month and churns duplicate/renamed rows. It runs
# on its own windowed schedule in trend-scrape-newengen.yml.
#
# Scheduled workflows run on the default branch only.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC ≈ 9am ET
  workflow_dispatch:
    inputs:
      force:
        description: "Re-parse pages even if unchanged since last run"
        type: boolean
        default: false

concurrency:
  group: trend-scrape-static
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest-trends (static)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `requests` is imported directly but not yet a declared dependency (same as ci.yml).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install requests

      # One --source-name call per source (the CLI selects a single source; per-source failures
      # are caught internally so one bad source won't abort the others).
      - name: Run ingest-trends (ramdam, socialbee, socialgrowthengineers)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # JWT that unlocks the socialgrowthengineers gated newsletter; expires ~quarterly (refresh
          # via scratchpad/sge_unlock.py). If unset/expired, only that source errors; others run.
          SGE_ACCESS_TOKEN: ${{ secrets.SGE_ACCESS_TOKEN }}
          # SMTP creds for the parser-drift reminder email (drift_alert.py) — free relay
          # (Gmail app password by default; Brevo etc. via the HOST/PORT/FROM overrides).
          # If unset, drift is only logged in the run output.
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        # --fail-on-drift turns a broken parser into a red run, so GitHub's own workflow-failure
        # email is the fix-it reminder even with no SMTP secrets configured. rc accumulation keeps
        # one drifted source from skipping the rest.
        run: |
          rc=0
          for src in ramdam socialbee socialgrowthengineers; do
            echo "::group::ingest-trends $src"
            python -m instaagent_pipeline.cli ingest-trends --source-name "$src" --fail-on-drift ${{ inputs.force && '--force' || '' }} || rc=1
            echo "::endgroup::"
          done
          exit $rc
